[phases.setup]
nixPkgs = [
  "python39", 
  "cairo", 
  "pango", 
  "gdk-pixbuf", 
  "librsvg",
  "gobject-introspection",
  "fontconfig",
  "freetype",
  "glib",
  "harfbuzz",
  "fribidi",
  "pixman"
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "python -c 'import weasyprint; print(\"WeasyPrint test import successful\")'"
]

[phases.build]
cmds = [
  "echo 'Setting up font cache...'",
  "fc-cache -fv",
  "echo 'Build phase complete'"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHONPATH = "/app"
FONTCONFIG_PATH = "/nix/store/*/etc/fonts:/usr/share/fonts"
GDK_PIXBUF_MODULE_FILE = "/nix/store/*/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
WEASYPRINT_DPI = "96"
PANGOCAIRO_BACKEND = "fontconfig" 