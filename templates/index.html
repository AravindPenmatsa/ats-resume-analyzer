<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Analyzer</title>
    <style>
        body {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 400px;
        }
        h2 {
            margin-bottom: 25px;
        }
        input[type="file"] {
            display: block;
            margin: 15px auto;
        }
        button {
            padding: 12px 30px;
            background-color: #2c7be5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1a5fcc;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Optimize Your Resume</h2>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <label>Upload Resume (TXT, PDF, DOCX):</label>
            <input type="file" name="resume" required>
            <label>Upload Job Description (TXT, PDF, DOCX):</label>
            <input type="file" name="jobdesc" required>
            <button type="submit">Evaluate</button>
        </form>
        <div class="footer">Powered by ATS Resume Analyzer</div>
    </div>
</body>
</html>
