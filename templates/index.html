
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATS Resume Optimizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: "Segoe UI", sans-serif; margin: 0; padding: 0; background: #f2f7fc; }
        header { background-color: #0077cc; color: white; padding: 1.5em; text-align: center; }
        .container { max-width: 900px; background: white; margin: 2em auto; padding: 2em; border-radius: 10px; box-shadow: 0 0 12px rgba(0,0,0,0.1); }
        h2 { color: #222; }
        label { font-weight: bold; display: block; margin-top: 1.5em; }
        input[type="file"] { margin-top: 0.5em; }
        input[type="submit"] {
            margin-top: 2em;
            padding: 10px 20px;
            background-color: #0077cc;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        .summary { margin-top: 2em; padding: 1em; border-radius: 5px; background: #e6f2ff; }
        .keyword-list { color: #0077cc; list-style-type: disc; margin-left: 1.2em; }
        .chart-container { width: 200px; margin: 1em auto; }
        .download-link { margin-top: 1.5em; display: inline-block; padding: 10px 15px; background: #0077cc; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <h1>ATS Resume Optimizer</h1>
</header>

<div class="container">
    <h2>Upload Your Resume & Job Description</h2>
    <form id="uploadForm" enctype="multipart/form-data">
        <label for="resume">Resume (.txt, .docx, .pdf)</label>
        <input type="file" name="resume" id="resume" accept=".txt,.docx,.pdf" required>

        <label for="jd">Job Description (.txt, .docx, .pdf)</label>
        <input type="file" name="jd" id="jd" accept=".txt,.docx,.pdf" required>

        <input type="submit" value="Evaluate Resume">
    </form>

    <div id="result" class="summary" style="display:none;">
        <div class="chart-container">
            <canvas id="scoreChart"></canvas>
        </div>
        <div id="scoreText"></div>
        <h3>Missing Keywords</h3>
        <ul id="keywords" class="keyword-list"></ul>
        <a id="downloadLink" class="download-link" href="#" download>⬇️ Download Improved Resume</a>
    </div>
</div>

<script>
    const form = document.getElementById('uploadForm');
    const resultDiv = document.getElementById('result');
    const scoreText = document.getElementById('scoreText');
    const keywordList = document.getElementById('keywords');
    const downloadLink = document.getElementById('downloadLink');

    let scoreChart;

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        resultDiv.style.display = "block";
        resultDiv.innerHTML = "⏳ Evaluating resume...";

        try {
            const response = await fetch('/evaluate-details', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const json = await response.json();
                resultDiv.innerHTML = `
                    <div class="chart-container"><canvas id="scoreChart"></canvas></div>
                    <div id="scoreText">ATS Score: ${json.ats_score}%</div>
                    <h3>Missing Keywords</h3>
                    <ul id="keywords" class="keyword-list">${json.missing_keywords.map(k => `<li>${k}</li>`).join("")}</ul>
                    <a id="downloadLink" class="download-link" href="${json.download_url}" download>⬇️ Download Improved Resume</a>
                `;

                const ctx = document.getElementById("scoreChart").getContext("2d");
                if (scoreChart) scoreChart.destroy();
                scoreChart = new Chart(ctx, {
                    type: "doughnut",
                    data: {
                        labels: ["Match", "Gap"],
                        datasets: [{
                            data: [json.ats_score, 100 - json.ats_score],
                            backgroundColor: ["#007a33", "#d3d3d3"]
                        }]
                    },
                    options: {
                        cutout: "70%",
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            } else {
                resultDiv.innerHTML = "❌ Failed to evaluate resume.";
            }
        } catch (err) {
            resultDiv.innerHTML = "❌ Error: " + err;
        }
    });
</script>

</body>
</html>
