
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 80px auto;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            color: #2d3748;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        label {
            font-weight: 600;
        }
        input[type="file"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Optimize Your Resume</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <div>
            <label for="resume">Upload Resume (TXT, PDF, DOCX):</label>
            <input type="file" id="resume" name="resume" accept=".txt,.pdf,.doc,.docx" required>
        </div>
        <div>
            <label for="job_description">Upload Job Description (TXT, PDF, DOCX):</label>
            <input type="file" id="job_description" name="job_description" accept=".txt,.pdf,.doc,.docx" required>
        </div>
        <button type="submit">Evaluate</button>
    </form>
    <div class="footer">
        Powered by ATS Resume Analyzer
    </div>
</div>
</body>
</html>
