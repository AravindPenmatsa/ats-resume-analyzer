<!DOCTYPE html>
<html>
<head>
    <title>Resume Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #36D1DC, #5B86E5);
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 100px;
        }
        .card {
            padding: 30px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="card shadow col-md-6">
        <h2 class="text-center mb-4">Optimize Your Resume</h2>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="resume" class="form-label">Upload Resume (TXT, PDF, DOCX):</label>
                <input class="form-control" type="file" name="resume" required>
            </div>
            <div class="mb-3">
                <label for="jobdesc" class="form-label">Upload Job Description (TXT, PDF, DOCX):</label>
                <input class="form-control" type="file" name="jobdesc" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Evaluate</button>
            </div>
        </form>

        {% if score is defined %}
        <div class="mt-4 alert alert-info">
            <h5>Match Score: {{ score }}%</h5>
            <p>{{ suggestion }}</p>
        </div>
        {% endif %}

        <div class="text-center mt-3 text-muted" style="font-size: 0.9em;">
            Powered by ATS Resume Analyzer
        </div>
    </div>
</div>
</body>
</html>
